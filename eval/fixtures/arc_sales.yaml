id: arc_sales
description: >
  Enterprise sales follow-ups across a quarter. The first fixture from a
  PROFESSIONAL setting: company and role are populated and CONFLICTING, not
  silent. Every other arc is one hall or one orientation group where nobody has
  an employer, so those two channels have never been exercised -- and a silent
  field scores nothing while a conflicting one scores against, a swing large
  enough to decide a case on its own. Also carries dated commitments in most
  memos: a promise lands in `notes`, and `notes` IS a resolution channel, so a
  later memo can recognise someone by the promise alone.

memos:
  # ---- the two Alexes are planted here, three memos apart, so the second one
  # arrives when the first is already in the graph and can be merged onto.
  - id: m1
    transcript: |
      Okay just got out of the fintech summit at Marina Bay Sands. Long chat
      with Alex Chua from Deloitte, he runs their data platform team, was
      digging into how our streaming ingest handles late-arriving events.
      Genuinely technical guy. I said I'd send him the architecture deck by
      Friday. Also caught Priya for maybe five minutes, she's a solutions
      architect at AWS, spent the whole time complaining about a migration
      backlog she can't get headcount for.
    mentions:
      - {
          cluster: alex_chua,
          as: "Alex Chua",
          substantive: true,
          ambiguous: false,
        }
      - { cluster: priya, as: "Priya", substantive: true, ambiguous: false }

  - id: m2
    transcript: |
      Follow-up call with the Deloitte guy went well. He's taken the deck to
      his architecture review board, wants a pricing conversation once that
      clears. Said he'd come back to me in about two weeks. Also he mentioned
      his team is eight engineers, smaller than I assumed.
    mentions:
      - {
          cluster: alex_chua,
          as: "the Deloitte guy",
          substantive: true,
          ambiguous: false,
        }

  - id: m3
    transcript: |
      Ran into Marcus at the lobby coffee place, said hi, he was rushing to
      something. Nothing else. Then a proper meeting with Wei Lin from GIC,
      she's a portfolio manager on the systematic side, wants to understand
      whether we can do point-in-time reconstruction of the data. Promised her
      a written answer on that by end of next week.
    mentions:
      - { cluster: marcus, as: "Marcus", substantive: false, ambiguous: false }
      - { cluster: wei_lin, as: "Wei Lin", substantive: true, ambiguous: false }

  # ---- the precision test. A second Alex, different company, different role.
  # Nothing about him should touch alex_chua's record.
  - id: m4
    transcript: |
      Payments meetup at Lau Pa Sat tonight. Met another Alex, confusing sia.
      This one is Alex Tan, he's in payments compliance at OCBC, much older,
      maybe mid forties, nothing to do with the Deloitte one. He offered to
      introduce me to someone he knows at MAS. I said I'd ping him Monday to
      take him up on it.
    mentions:
      - {
          cluster: alex_tan,
          as: "Alex Tan",
          substantive: true,
          ambiguous: false,
        }

  # ---- recognition by the promise, not by the name or the company.
  - id: m5
    transcript: |
      Finally sent that architecture deck out this morning, way later than the
      Friday I promised. Apologised in the email. He came back within the hour
      asking whether the late-event handling is configurable per stream, which
      I think means the review board actually read it.
    mentions:
      - { cluster: alex_chua, as: "He", substantive: true, ambiguous: false }

  # ---- the job change. Company now argues AGAINST a correct match.
  - id: m6
    transcript: |
      Bumped into Priya at the meetup and she's left AWS, she's at a healthtech
      startup called Sagely now, head of platform. Much happier. Same migration
      problem though, just smaller. She wants an intro to our infra lead, said
      I'd set that up this week.
    mentions:
      - { cluster: priya, as: "Priya", substantive: true, ambiguous: false }

  - id: m7
    transcript: |
      Quarterly review prep. Called the GIC portfolio manager to check where
      she'd landed on the reconstruction question. She says the written answer
      was enough for her team to move to a pilot conversation, which is the
      best outcome I've had all quarter. Sending over the pilot scoping doc on
      Thursday.
    mentions:
      - {
          cluster: wei_lin,
          as: "the GIC portfolio manager",
          substantive: true,
          ambiguous: false,
        }

  # ---- role-only reference to somebody new, plus a second passing mention.
  - id: m8
    transcript: |
      Deloitte brought their head of procurement into the call, which is
      usually a good sign. She wanted our standard MSA and a security
      questionnaire, said I'd get both over by the 20th. Marcus was on the call
      too but didn't say anything.
    mentions:
      - {
          cluster: deloitte_procurement,
          as: "their head of procurement",
          substantive: true,
          ambiguous: false,
        }
      - { cluster: marcus, as: "Marcus", substantive: false, ambiguous: false }

  # ---- the genuinely ambiguous one. Two Alexes are now both in the graph and
  # the speaker themselves does not know which is meant. Exactly one of these.
  - id: m9
    transcript: |
      Voicemail from an Alex, no surname, something about a meeting next week.
      Could be either of them honestly, the Deloitte one or the OCBC one, the
      number wasn't saved. Need to figure out which before I call back.
    mentions:
      - {
          cluster: UNRESOLVED,
          as: "an Alex",
          substantive: true,
          ambiguous: true,
        }

  - id: m10
    transcript: |
      Alex Tan came through on the MAS introduction, forwarded me to a deputy
      director there. Owe him a proper thank you, and he asked whether we
      handle PDPA-scoped data residency, which I need to check with legal
      before I answer him next Tuesday.
    mentions:
      - {
          cluster: alex_tan,
          as: "Alex Tan",
          substantive: true,
          ambiguous: false,
        }

  # ---- descriptor-only reference to someone already known, no name, no company.
  - id: m11
    transcript: |
      The head of platform at that healthtech startup wants to move fast, she
      says they have budget this quarter and not next. Sent the intro to our
      infra lead already. Need to get her a rough integration estimate before
      Friday or the budget conversation happens without us.
    mentions:
      - {
          cluster: priya,
          as: "The head of platform at that healthtech startup",
          substantive: true,
          ambiguous: false,
        }

  # ---- the THREE-WAY. Wei Lin brings two GIC colleagues, so the graph now
  # holds three people who share one employer. A later loose reference to "the
  # GIC team" then fits all three equally -- company agrees for each, no name
  # fires, so every candidate caps at NAMELESS_CEILING and the band flags a
  # genuine three-hypothesis tie. Two candidates make every question worth the
  # same bits (a dead heat for EIG); three give the argmax something to choose.
  # Each colleague carries a distinguishing attribute so an attribute question
  # can actually separate them.
  - id: m12
    transcript: |
      Wei Lin brought two of her GIC colleagues to the modelling call. Daniel
      Ong, a data engineer on her team, hammered us on how we version features.
      And Meixiang, a quant analyst, she is the one who will actually run the
      pilot day to day. Told Daniel I'd share the versioning design by Monday.
    mentions:
      - {
          cluster: wei_lin,
          as: "Wei Lin",
          substantive: false,
          ambiguous: false,
        }
      - {
          cluster: daniel_ong,
          as: "Daniel Ong",
          substantive: true,
          ambiguous: false,
        }
      - {
          cluster: meixiang,
          as: "Meixiang",
          substantive: true,
          ambiguous: false,
        }

  - id: m13
    transcript: |
      Someone from the GIC team emailed asking where the pilot scoping doc is.
      Pretty sure it's the one who's running the pilot day to day, but I need to
      check which of them before I reply so I don't send it to the wrong person.
    mentions:
      - {
          cluster: meixiang,
          as: "someone from the GIC team",
          substantive: true,
          ambiguous: false,
        }
