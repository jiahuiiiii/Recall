      Vertex Ventures, investment principal, mostly B2B software. She said our retention

      slide is too fluffy and asked me to send the Q2 and Q3 cohort chart by Friday.

      Don''t send the full deck, just the chart and one sentence on June. Then Ravi Menon,

      family office guy, came over. He wants to know whether we already have paying

      customers in Malaysia. I said I''d send him a redacted customer list next week,

      after I check what we can disclose. Maya email, Ravi email also.

