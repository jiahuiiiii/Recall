- id: arc_consulting
  description: Consulting and project-delivery notes spanning client sponsors, data leads, and changing project roles.
  memos:
  - id: m1
    transcript: 'Post-workshop note. Michelle Yeo from KPMG, transformation lead, is sponsoring the

      claims project. She wants the current-state map by Monday, only the three biggest

      bottlenecks. Akash Mehta from their data team wants the sample schema before that so he

      can check fields, Friday is enough. I said I''ll email both separately. Michelle also

      said one branch manager called Kenji may join later, but I haven''t met him.

      '
    mentions:
    - cluster: michelle_yeo
      as: Michelle Yeo
      substantive: true
      ambiguous: false
    - cluster: akash_mehta
      as: Akash Mehta
      substantive: true
      ambiguous: false
    - cluster: kenji_other
      as: Kenji
      substantive: false
      ambiguous: false
  - id: m2
    transcript: 'Another client today. Met Michelle Liu from EY, customer strategy, different Michelle.

      Her retail client wants a workshop on lost customer context when account managers rotate.

      No fixed date, probably October. Tomás Silva, independent design researcher, may facilitate.

      He wants the interview guide sometime next week if the client confirms him. Michelle said

      keep one Saturday option because sales leads travel.

      '
    mentions:
    - cluster: michelle_liu
      as: Michelle Liu
      substantive: true
      ambiguous: false
    - cluster: tomas_silva
      as: Tomás Silva
      substantive: true
      ambiguous: false
  - id: m3
    transcript: 'The KPMG transformation lead called. Monday deadline moved to Sunday evening because the

      steering pack closes Monday morning. She wants one slide before-and-after, appendix later.

      Akash said schema is basically fine, just phone-number formatting. I promised to correct

      the sample tonight. Michelle Yeo Sunday, Akash nothing else after the clean file.

      '
