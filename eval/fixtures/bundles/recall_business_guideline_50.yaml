  - id: m4
    transcript: 'Client-site corridor note. Met Farah Noor, operations manager at BrightMart. Half their

      customer complaints get handed over through WhatsApp screenshots and nobody can tell who

      promised what. Wants a pilot example after quarter close. Her regional COO, Kenji Sato,

