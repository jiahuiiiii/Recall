- id: arc_enterprise_sales
  description: Enterprise-sales account notes covering champions, procurement, legal, and partner follow-ups.
  memos:
  - id: m1
    transcript: 'Insurance roundtable just finished. Natalie Koh from Prudential, customer ops director,

      said adviser handover is the pain. She wants a five-minute mobile demo next Wednesday,

      afternoon if possible, and I said I''d send two time options tomorrow. Omar Farooq from

      SAP partner solutions sat beside her. He thinks there may be a co-sell angle and asked

      for one customer example by next week, no full deck.

      '
