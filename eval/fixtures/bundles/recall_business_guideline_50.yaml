    transcript: 'Antler coffee thing. Met Maya Lim, programme lead there, different Maya. She wants

      a founder office-hours call sometime next week, mostly go-to-market, no fundraising

      pitch. Julian Park from LogiQ joined after. Product founder, warehouse software.

      He said one of his customers may need our API and asked me to WhatsApp the docs

      tomorrow. Maya Lim said just send a calendar link. Oh Teresa Wong was near the lift,

      we only waved, didn''t actually talk.

