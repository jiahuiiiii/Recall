    - cluster: natalie_koh
      as: Natalie Koh
      substantive: true
      ambiguous: false
    - cluster: omar_farooq
      as: Omar Farooq
      substantive: true
      ambiguous: false
  - id: m2
    transcript: 'Lunch at UOB. Met Natalie Goh from transformation, Goh with G, different Natalie.

      She wants to know whether someone can correct a bad person match and still see the old

      value. Screenshots next week are enough. Kelvin Tay, their head of procurement, joined

      for ten minutes but said he only comes in after security, so nothing for him yet.

      Sophia Wu from UOB risk was beside him and asked whether the demo can use fake customer

      names; I said yes. Jason Teh from legal was copied on the invite but never showed up.

      '
    mentions:
    - cluster: natalie_goh
      as: Natalie Goh
      substantive: true
      ambiguous: false
    - cluster: kelvin_tay
      as: their head of procurement
      substantive: true
      ambiguous: false
    - cluster: sophia_wu
      as: Sophia Wu
      substantive: true
      ambiguous: false
    - cluster: jason_teh
      as: Jason Teh
      substantive: false
      ambiguous: false
  - id: m3
    transcript: 'Prudential Natalie called. Demo is Wednesday two, not just afternoon. She wants one

      adviser leaving, another taking over, then searching the customer from a vague clue

      like ''the dentist from Tampines''. I said I''ll send the final link Tuesday night.

      Her boss Elise Martin may join, but Elise hasn''t confirmed, so don''t build extra slides.

      '
