  - id: m10
    transcript: |
      Friday wrap, last one. The finance director from Sea went through the
      governance checklist and wants their legal team on the next call. That
      one probably needs forty-five minutes because he wants to check every
      approval step. I said Monday I send three time slots. The GovTech product
