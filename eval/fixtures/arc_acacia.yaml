id: arc_acacia
description: ARC — the friends I met at Acacia College in NUS.
# This is where the benchmark numbers come from. Target 6-12 memos, chronological.
# The graph starts EMPTY and grows as you go, so later memos are harder.
#
# Work the hard cases in naturally, don't isolate them:
#   - someone from an early memo reappearing, referred to loosely
#   - two people with the same first name, met weeks apart
#   - a mention you genuinely cannot resolve  -> ambiguous: true,  cluster: UNRESOLVED
#   - people you only greet                   -> substantive: false
#   - someone who changes job or course between memos
#
# Write the transcript as Whisper would output it: no punctuation cleanup,
# filler words, self-corrections, Singlish, code-switching. Names at code-switch
# boundaries are the realistic worst case and the one worth capturing.
#
# Check as you go:  uv run eval/check_fixtures.py

memos:
  - id: m1
    transcript: |
      I meet Viktoria at dining hall one day when I was having breakfast alone. She suddenly sat in front of me and started talking to me. Apparently she was from germany, and exchange here. She lives in the Tembusu College. We only managed to have a short conversation becuase she have to leave. As I mentioned I'm interested in exchange to germany, she proposed that we can exchange our contact.
    mentions:
      - {
          cluster: viktoria,
          as: "Viktoria",
          substantive: true,
          ambiguous: false,
        }
  - id: m2
    transcript: |
      I met Kit Yee at the Acacia orientation camp. She is in the same group as me. We both from group 2. She's also from malaysian chinese independent school. She a quiet person but she is friendly. She also lives at the 18th floor. She studies geospatial intelligence at NUS.
    mentions:
      - { cluster: kit_yee, as: "Kit Yee", substantive: true, ambiguous: false }
  - id: m3
    transcript: |
      Crispy is my high school friend, also from Malaysian Chinese independent school. her full name is tiu chuei enn, but we all call her crispy due to her chinese name. She also lives in Acacia College. She lives on the 4th floor. She also studies computer sciencae at NUS.
    mentions:
      - { cluster: crispy, as: "Crispy", substantive: true, ambiguous: false }
  - id: m4
    transcript: |
      I have breakfast with the german girl and her friend. I was quite nervous at first. But they are nice people. I had a great lunch. Her friend kinda hot btw.
    mentions:
      # Same human as m1. `cluster` is the person; `as` is how she was referred
      # to this time. Keeping the cluster id is what makes this a recognition test.
      - {
          cluster: viktoria,
          as: "the german girl",
          substantive: true,
          ambiguous: false,
        }
      # Unnamed: opinions attached, but "her friend" cannot be deduped or
      # contacted, so she is not a contact record.
      - {
          cluster: viktoria_friend,
          as: "her friend",
          substantive: false,
          ambiguous: false,
        }
