id: arc_godwin
description: >
  Luminia orientation group and the hall term after it. Twenty people met in a
  burst over three days, then re-encountered weeks later mostly by description
  rather than by name. Carries four same-first-name pairs (Hui Wen/Hui Ning,
  Jie Yu/Jing Yu, and the four Jia-), which is where the precision risk is.

memos:
  - id: m1
    transcript: |
      Okay first night of Luminia already. Our OGL is Su Ling, she's year 2,
      from Seremban, and she keep saying she's introvert one but honestly she
      ran the whole group damn well so I don't really believe her lah. Then
      there's another year 2, Zi Liang, psychology — this one really extrovert,
      he's the one who kept the mood up the whole night. And Annice, also year
      2, from Selangor. Very steady, very responsible type, and she was the one
      taking all the photos.
    mentions:
      - { cluster: su_ling,  as: "Su Ling",  substantive: true, ambiguous: false }
      - { cluster: zi_liang, as: "Zi Liang", substantive: true, ambiguous: false }
      - { cluster: annice,   as: "Annice",   substantive: true, ambiguous: false }

  - id: m2
    transcript: |
      Still day one. Sat with Cheng Ze during the ice breaker, year 1, from
      Johor. Super easy to talk to, we were just throwing jokes the whole time.
      Then Jia Qi, also year 1 — this one quite the opposite, quite introvert,
      don't really talk much, but every now and then he'll drop one joke and
      it's actually funny. Chill guy. Oh and Cheng Ze's friend Marcus came over
      for a while but I didn't really talk to him.
    mentions:
      - { cluster: cheng_ze, as: "Cheng Ze", substantive: true,  ambiguous: false }
