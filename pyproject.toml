[project]
name = "recall"
version = "0.1.0"
description = "Recall - a relationship-capture agent. Voice memo in, enriched person graph + drafted follow-ups + calendar commitments out."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-aws>=0.2.10",
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Transcription front-end. Bedrock/Claude cannot take audio, so this stays a
# discrete tool at the head of the graph rather than a model capability.
audio = ["groq>=0.13.0"]
# AgentCore runtime + long-term memory. Only needed once we deploy (billable).
aws = ["bedrock-agentcore>=0.1.0", "bedrock-agentcore-starter-toolkit>=0.1.0"]
# Local web UI: record a memo in the browser and watch the graph run.
web = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0", "python-multipart>=0.0.12"]
deploy = [
    "cryptography>=43.0.0",
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recall"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
