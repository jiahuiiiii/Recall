<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div class="top">
  <h1 class="brand">Re<em>call</em></h1>
  <p class="tag">Talk about who you met. Get contacts, commitments, and drafted follow-ups.</p>
</div>

<div class="shell">
<main>

  <div class="block">
    <p class="lab">Your memo</p>
    <div class="row">
      <button id="rec" class="btn go">● Record</button>
      <span class="time" id="timer"></span>
      <button id="pick" class="btn">Upload audio</button>
      <input type="file" id="file" accept="audio/*" class="hidden">
      <button id="sample" class="btn">Use sample</button>
      <button id="clear" class="btn">Clear</button>
    </div>
    <p class="note" id="hint">Record, or just type below. Chrome recommended for the microphone.</p>
    <textarea id="transcript"
      placeholder="Type what happened — who you met, what you talked about, anything you promised them.&#10;&#10;e.g. Met Wei Lin from GIC at the mixer, she's hiring for a quant infra role. Said I'd send her the Kestrel repo tomorrow."></textarea>
    <div class="gorow">
      <button id="run" class="btn go">Run the agent →</button>
      <span class="note" id="charcount"></span>
    </div>
  </div>

  <div id="psec" class="hidden">
    <div class="pipewrap">
      <p class="lab">The agent, running</p>
      <div class="scroll" id="diagram"></div>
      <div class="key">
        <span><i style="background:var(--sage)"></i>ran</span>
        <span><i style="background:var(--gold)"></i>running</span>
        <span><i style="background:var(--line2)"></i>branch not taken</span>
        <span class="swipe">swipe to see it all →</span>
      </div>
      <div class="meter" id="live"></div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div id="rsec" class="hidden">
    <div class="block">
      <p class="lab">Result</p>
      <div id="results"></div>
      <div class="total" id="usage"></div>
    </div>
  </div>

</main>

<aside class="side">
  <div class="block">
    <p class="lab">People I know <span id="pcount" style="letter-spacing:0;text-transform:none"></span></p>
    <div class="pgrid" id="people"></div>
    <p class="note" id="phint"></p>
    <a class="allbtn" id="pall" href="/people">Browse everyone <span class="arw">›</span></a>
    <!-- The grid answers "who do I know"; the graph answers "how do they
         stand to each other", which a grid cannot show. Two entry points
         rather than a tab, so neither view owns the other. -->
    <a class="allbtn" id="pgraph" href="/graph" style="margin-top:8px">See connections <span class="arw">›</span></a>
  </div>
</aside>
</div>

<script src="/shared.js"></script>
<script>

/* The diagram mirrors recall/graph.py exactly. x/y are viewBox units.
   The fork after `dedupe` is the whole point of drawing this rather than
   listing chips: a viewer can see which branch the router chose. */
const NODES = {
  transcribe:  {x:  10, y: 40, label:"transcribe",  sub:"groq whisper"},
  extract:     {x: 138, y: 40, label:"extract",     sub:"structured"},
  dedupe:      {x: 266, y: 40, label:"dedupe",      sub:"3-zone band"},
  ask:         {x: 394, y: 40, label:"ask",         sub:"argmax EIG"},
  enrich:      {x: 528, y: 10, label:"enrich",      sub:"sub-agent · web"},
  merge:       {x: 528, y: 70, label:"merge",       sub:"into record"},
  commitments: {x: 662, y: 40, label:"commitments", sub:"structured"},
  drafts:      {x: 790, y: 40, label:"drafts",      sub:"sub-agent"},
  calendar:    {x: 918, y: 40, label:"calendar",    sub:"idempotent"},
  persist:     {x:1046, y: 40, label:"persist",     sub:"memory"},
};
const W = 110, H = 34;
/* Mirrors recall/graph.py. `ask -> commitments` is real but not drawn: it
   would cross both branch boxes, and the branch is the thing this picture
   exists to show. */
const EDGES = [
  ["transcribe","extract"], ["extract","dedupe"], ["dedupe","ask"],
  ["ask","enrich"], ["ask","merge"],
  ["enrich","commitments"], ["merge","commitments"],
  ["commitments","drafts"], ["drafts","calendar"], ["calendar","persist"],
];

function drawDiagram(){
  const edges = EDGES.map(([a,b]) => {
    const A = NODES[a], B = NODES[b];
    const x1 = A.x + W, y1 = A.y + H/2, x2 = B.x, y2 = B.y + H/2;
    const d = y1 === y2
      ? `M${x1},${y1} L${x2},${y2}`
      : `M${x1},${y1} C${x1+14},${y1} ${x2-14},${y2} ${x2},${y2}`;
    return `<path class="edge" id="e-${a}-${b}" d="${d}" marker-end="url(#ar)"/>`;
  }).join("");

  const boxes = Object.entries(NODES).map(([k,n]) => `
    <g class="n" id="n-${k}">
      <rect class="nbox" x="${n.x}" y="${n.y}" width="${W}" height="${H}"/>
      <text class="ntext" x="${n.x+9}" y="${n.y+15}">${n.label}</text>
      <text class="nsub"  x="${n.x+9}" y="${n.y+26}">${n.sub}</text>
    </g>`).join("");

  $("diagram").innerHTML = `<svg viewBox="0 0 1168 118" role="img"
      aria-label="Recall pipeline: transcribe, extract, dedupe, ask, then a conditional branch to enrich or merge, then commitments, drafts, calendar, persist.">
    <defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)"/></marker></defs>
    ${edges}${boxes}</svg>`;
}

const ALL = () => Object.keys(NODES);
function setNode(n, cls){ const e = $("n-"+n); if(e) e.setAttribute("class", "n " + cls); }
function setEdge(a, b, cls){ const e = $(`e-${a}-${b}`); if(e) e.setAttribute("class","edge "+cls); }
function log(msg){ const d=document.createElement("div"); d.textContent=msg; $("log").appendChild(d); $("log").scrollTop=1e6; }

/* ---------- people graph ---------- */
let lastHits = new Set(), PEOPLE = {};


/* The sidebar is a "what changed lately" list, not the contact book. A whole
   graph in a 286px column is unreadable and unsortable; browsing, filtering and
   sorting live on /people, which has the room for them. The API already returns
   people newest-first by last_seen, so this is a slice, not a re-sort. */
const RECENT_LIMIT = 5;

function renderPeople(){
  const all = Object.values(PEOPLE);
  const shown = all.slice(0, RECENT_LIMIT);

  $("people").innerHTML = shown.map(p => {
    const hit = lastHits.has(p.name) ? " hit" : "";
    const sel = selectedId === p.id ? " sel" : "";
    return `<button class="pcard${hit}${sel}" data-id="${esc(p.id)}"
               aria-expanded="${selectedId === p.id}">
      <span class="arw">›</span>
      <b>${esc(p.name)}</b>
      <div class="m2">${esc(subtitle(p) || "—")}</div>
      <div class="cnt">${p.notes.length} note${p.notes.length===1?"":"s"} · ${metLabel(p)}</div>
    </button>`;
  }).join("");
  $("people").querySelectorAll(".pcard").forEach(b => {
    b.onclick = () => showPerson(b.dataset.id);
  });
  const more = all.length - shown.length;
  $("phint").textContent = more > 0 ? `${more} more not shown` : "";
  const btn = $("pall");
  if (btn) btn.textContent = all.length ? `Browse all ${all.length} ` : "Browse everyone ";
  if (btn) btn.insertAdjacentHTML("beforeend", '<span class="arw">›</span>');
}

async function loadPeople(){
  try {
    const r = await fetch("/api/people");
    const j = await r.json();
    $("pcount").textContent = j.count ? `— ${j.count} remembered` : "";
    if (!j.count) {
      PEOPLE = {}; closePerson();
      $("people").innerHTML = "";
      $("phint").textContent = "Empty. Run a memo and the people in it are remembered here — that is what the next run dedupes against.";
      return;
    }
    $("phint").textContent = "";
    PEOPLE = {};
    for (const p of j.people) PEOPLE[p.id] = p;

    renderPeople();
    if (selectedId && PEOPLE[selectedId]) showPerson(selectedId, true);
    else if (selectedId) closePerson();
  } catch (e) { $("phint").textContent = "Could not load the person graph: " + e.message; }
}

/* The record itself opens as a floating dialog defined in shared.js -- notes,
   merge and forget stay in one place, so /people opens the same panel rather
   than navigating back here with ?person=<id> and losing its filters. */
configurePersonPanel({
  people: () => Object.values(PEOPLE),
  reload: loadPeople,
});

let mediaRecorder, chunks = [], starting = false;

/* ---------- recording ----------
   Everything about one recording session lives in locals captured here, not in
   module state. The timer used to read the module-level recorder and store its
   own handle in a module-level `tick`: a second click during the getUserMedia
   await started a second session, orphaned the first recorder's stream and lost
   its interval handle, so that interval ticked forever and kept writing the
   timer after Stop. Now each session's timer can only touch its own recorder,
   and clears itself the moment that recorder is no longer recording. */
$("rec").onclick = async () => {
  if (mediaRecorder && mediaRecorder.state !== "inactive") { mediaRecorder.stop(); return; }
  // The await below is a window in which the guard above still sees the *old*
  // recorder, so without this an impatient second click starts a second one.
  if (starting) return;
  starting = true;
  $("rec").disabled = true;

  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch (e) { $("hint").textContent = "Microphone blocked: " + e.message + ". Check the address bar permission icon."; return; }
  finally { starting = false; $("rec").disabled = false; }

  chunks = [];
  const rec = new MediaRecorder(stream);
  mediaRecorder = rec;

  // Declared before finish() so there is no temporal-dead-zone hazard if a
  // handler ever fires earlier than expected.
  let tick;
  // Idempotent: stop() fires onstop once, but an error path may also land here.
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    clearInterval(tick);
    stream.getTracks().forEach(t => t.stop());
    $("timer").textContent = "";
    $("rec").className = "btn go"; $("rec").innerHTML = "● Record"; $("rec").disabled = false;
  };

  rec.ondataavailable = e => chunks.push(e.data);
  rec.onerror = () => { finish(); $("hint").textContent = "Recording stopped unexpectedly."; };
  rec.onstop = () => { finish(); sendAudio(new Blob(chunks, {type: rec.mimeType}), "memo"); };

  rec.start();
  const startedAt = Date.now();
  $("rec").className = "btn on"; $("rec").innerHTML = '<span class="dot"></span>Stop';
  tick = setInterval(() => {
    // Self-clearing, so this timer cannot outlive its own recording even if
    // onstop never arrives. Guarding the cap on state also stops the old code
    // calling stop() every 250ms once past 120s, which throws InvalidStateError
    // on an already-inactive recorder without cancelling the interval.
    if (rec.state !== "recording") { clearInterval(tick); return; }
    const s = Math.floor((Date.now()-startedAt)/1000);
    $("timer").textContent = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
    if (s >= 120) rec.stop();   // Groq free tier caps upload size
  }, 250);
};

$("pick").onclick = () => $("file").click();
$("file").onchange = e => { if (e.target.files[0]) sendAudio(e.target.files[0], e.target.files[0].name); };
$("sample").onclick = () => {
  $("transcript").value =
"Just left the SuperAI mixer at Marina Bay Sands. Met Wei Lin from GIC, she's a quant infrastructure lead, "+
"complaining their feature store is held together with cron jobs. She's hiring for a quant infra role. I said "+
"I'd send her the Kestrel repo tomorrow. Also met Arjun Menon at Sea Group on recommendations, he did that talk "+
"on embedding drift. I told him I'd introduce him to Marcus by end of week.";
  updateCount();
  $("transcript").focus();
};

$("clear").onclick = () => {
  $("transcript").value = ""; updateCount(); $("transcript").focus();
  $("hint").textContent = "Record, or just type below. Chrome recommended for the microphone.";
};

function updateCount(){
  const n = $("transcript").value.trim().length;
  $("charcount").textContent = n ? `${n} characters` : "";
  $("run").disabled = n === 0;
}
$("transcript").addEventListener("input", updateCount);

// Cmd/Ctrl+Enter runs, so a typed memo never needs the mouse.
$("transcript").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && !$("run").disabled) $("run").click();
});

async function sendAudio(blob, name){
  $("hint").textContent = "Transcribing…";
  const fd = new FormData();
  fd.append("audio", blob, name);
  try {
    const r = await fetch("/api/transcribe", {method:"POST", body:fd});
    const j = await r.json();
    if (!r.ok) { $("hint").textContent = j.error || "Transcription failed."; return; }
    $("hint").textContent = "Transcribed. Check the names — the box below is editable — then run.";
    // Append rather than overwrite, so recording a second thought adds to a
    // memo instead of destroying what is already typed.
    const existing = $("transcript").value.trim();
    $("transcript").value = existing ? existing + "\n\n" + j.transcript : j.transcript;
    updateCount();
    $("transcript").focus();
  } catch (e) { $("hint").textContent = "Could not reach the server: " + e.message; }
}

/* ---------- run ---------- */
$("run").onclick = async () => {
  const transcript = $("transcript").value.trim();
  if (!transcript) return;
  $("run").disabled = true;
  $("psec").classList.remove("hidden");
  $("rsec").classList.add("hidden");
  $("log").innerHTML = ""; $("results").innerHTML = ""; $("usage").textContent = "";
  ranNodes = new Set();
  drawDiagram();
  ALL().forEach(n => setNode(n, ""));
  EDGES.forEach(([a,b]) => setEdge(a,b,""));
  setNode("transcribe","done"); log("Transcript supplied.");
  $("live").textContent = "";

  await drive("/api/run", {transcript});
  $("run").disabled = false;
};

/* Both legs of a run stream identical NDJSON: /api/run until the graph either
   finishes or stops to ask, then /api/answer for the rest. One reader handles
   both, so a resumed run lights the pipeline strip exactly like a fresh one. */
async function drive(url, body){
  try {
    const res = await fetch(url, {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify(body)
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split("\n"); buf = lines.pop();
      for (const l of lines) { if (l.trim()) handle(JSON.parse(l)); }
    }
  } catch (e) {
    $("results").innerHTML = `<div class="bad">${esc(e.message)}</div>`;
    $("rsec").classList.remove("hidden");
  }
}

/* The id of the run currently paused on a question. Null whenever nothing is
   waiting, which is what stops a second click answering an already-answered
   question and resuming a run that has moved on. */
let pendingThread = null;

async function answer(value){
  if (!pendingThread) return;
  const thread = pendingThread;
  pendingThread = null;

  document.querySelectorAll("#results .opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.value === value) b.classList.add("picked");
  });
  log(`Answered: ${value}`);
  await drive("/api/answer", {thread_id: thread, answer: value});
}

let ranNodes = new Set();
function handle(ev){
  if (ev.type === "node") {
    ranNodes.add(ev.node);
    setNode(ev.node, "done");
    // Light the edges into this node from anything that already ran.
    EDGES.forEach(([a,b]) => { if (b === ev.node && ranNodes.has(a)) setEdge(a,b,"live"); });
    if (ev.note) log(ev.note);
    if (ev.usage) showLive(ev.usage);
  } else if (ev.type === "done") {
    // Whatever never arrived is dimmed. On a memo with only known people the
    // enrich box and its edges stay dark -- that IS the conditional edge.
    ALL().forEach(n => { if (!ranNodes.has(n)) setNode(n, "skip"); });
    EDGES.forEach(([a,b]) => {
      if (!(ranNodes.has(a) && ranNodes.has(b))) setEdge(a,b,"dead");
    });
    lastHits = new Set((ev.state.known_matches||[]).map(m => m.person.name));
    render(ev.state, ev.usage);
    loadPeople();
  } else if (ev.type === "question") {
    // The graph is PAUSED, not finished. The pipeline strip deliberately keeps
    // its unrun nodes undimmed -- dimming them is the "done" signal, and this
    // run is very much still going.
    pendingThread = ev.thread_id;
    $("results").innerHTML = questionCard(ev.question, true);
    $("rsec").classList.remove("hidden");
    $("rsec").scrollIntoView({behavior:"smooth", block:"nearest"});
    if (ev.usage) showLive(ev.usage);
    document.querySelectorAll("#results .opt").forEach(b => {
      b.onclick = () => answer(b.dataset.value);
    });
  } else if (ev.type === "confirm") {
    // Also a pause, so the pipeline strip stays undimmed for the same reason.
    pendingThread = ev.thread_id;
    $("results").innerHTML = confirmCard(ev.confirm, true);
    $("rsec").classList.remove("hidden");
    $("rsec").scrollIntoView({behavior:"smooth", block:"nearest"});
    if (ev.usage) showLive(ev.usage);
    const picked = () => Array.from(document.querySelectorAll(".evtbox"))
      .filter(b => b.checked).map(b => b.dataset.index);
    $("evt-add").onclick = () => {
      const sel = picked();
      // "none" rather than "" -- an empty string is exactly the unparseable
      // reply the node declines on, and going through the explicit word means
      // the intent is the same on both sides of the wire.
      answer(sel.length ? sel.join(",") : "none");
    };
    $("evt-skip").onclick = () => answer("none");
  } else if (ev.type === "error") {
    $("results").innerHTML = `<div class="bad">${esc(ev.message)}</div>`;
    $("rsec").classList.remove("hidden");
  }
}

function showLive(u){
  const cost = (u.unpriced && u.unpriced.length) ? "unpriced model" : `$${u.cost}`;
  $("live").textContent = `${u.calls} model calls · ${u.input} in / ${u.output} out · ${cost}`;
}


/* The chosen question, the candidates it is choosing between, and the questions
   it turned down with the bits each was worth.

   Rejected questions are not decoration. "Same school as you?" sounds like a
   sensible thing to ask and is worth 0.000 bits here, because both candidates
   answer it identically; showing that number next to the one it did ask is the
   only thing that separates a computed choice from a plausible-sounding one. */
function questionCard(q, live){
  if (!q) return "";

  const hyps = (q.hypotheses || []).map(h => {
    const pct = Math.round((h.prior || 0) * 100);
    const label = h.record_id ? h.name : "someone new";
    return `<div class="hyp"><span class="nm">${esc(label)}</span>
      <span class="bar"><i style="width:${pct}%"></i></span>
      <span class="pc">${pct}%</span></div>`;
  }).join("");

  // Buttons only while the graph is actually waiting. After the run has moved
  // on they render as plain pills -- a control that looks live and does nothing
  // is worse than no control.
  const opts = (q.answers || []).map(a => {
    const cls = "opt" + (a === "something else" ? " else" : "");
    return live
      ? `<button class="${cls}" data-value="${esc(a)}">${esc(a)}</button>`
      : `<span class="${cls}">${esc(a)}</span>`;
  }).join("");

  const rejected = (q.rejected || []).map(r => `
    <div class="rejrow${r.eig < 0.0005 ? " zero" : ""}">
      <span>${esc(r.question)} <span class="shape">${esc(r.kind)}</span></span>
      <span class="bits">${r.eig.toFixed(3)} bits</span>
    </div>`).join("");

  // Bits bought against bits outstanding. 0.80 is a different claim against a
  // 1.27-bit prior than against 3.0, and the ratio is what a judge will ask for.
  const prior = q.prior_entropy;
  const context = prior
    ? `${q.eig.toFixed(3)} of ${prior.toFixed(3)} bits · ${Math.round(100*q.eig/prior)}% of the uncertainty`
    : `${q.eig.toFixed(3)} bits`;

  return `<div class="card ask">
    <span class="chip g">One question · chosen by EIG</span>
    <div class="sub" style="margin-top:8px">Cannot tell who
      <b>${esc(q.mention)}</b> is. ${(q.hypotheses||[]).length} candidates:</div>
    ${hyps}
    <p class="askq">${esc(q.question)}</p>
    <div class="sub" style="margin-top:7px"><span class="bits">${esc(context)}</span></div>
    <div class="opts">${opts}</div>
    ${live ? '<p class="note" style="margin-top:10px">Waiting — the run is paused here.</p>' : ""}
    ${rejected ? `<div class="rej">
      <p class="lab" style="margin-bottom:8px">Questions it did not ask</p>
      ${rejected}</div>` : ""}
  </div>`;
}

/* The calendar confirmation. Same pause mechanism as the question, different
   question: not "who is this" but "shall I write this down".

   Every proposed event is shown with the exact title and date that will be
   written -- the node hands over what `propose_event` built, not a paraphrase,
   so approving this is approving the thing that actually lands. Checked by
   default, because the common case is yes and a gate you have to fight is a
   gate people stop reading. */
function confirmCard(c, live){
  const events = c.events || [];
  const rows = events.map(e => `
    <label class="evt">
      <input type="checkbox" class="evtbox" data-index="${e.index}" checked>
      <span class="evtmain">
        <span class="evttitle">${esc(e.title)}</span>
        <span class="evtmeta">${esc(e.date)} · ${esc(e.channel || "email")}</span>
      </span>
    </label>`).join("");

  const where = c.backend === "mcp"
    ? "Google Calendar (via MCP)"
    : "the local ledger (data/calendar.json)";

  return `<div class="card ask">
    <span class="chip g">Confirm before writing</span>
    <p class="askq" style="font-size:20px">Add ${events.length}
      reminder${events.length === 1 ? "" : "s"} to your calendar?</p>
    <div class="sub" style="margin-top:2px">Destination: <b>${esc(where)}</b></div>
    <div class="evts">${rows}</div>
    ${live ? `<div class="opts" style="margin-top:12px">
      <button class="opt" id="evt-add">Add selected</button>
      <button class="opt else" id="evt-skip">Skip all</button>
    </div>
    <p class="note" style="margin-top:10px">Waiting — nothing is written until you choose.</p>`
    : ""}
  </div>`;
}

/* What the answer settled. Shown separately from the question so the two are
   visibly cause and effect, and so the confidence is stated rather than implied:
   one answer does not always settle a three-way tie, and asserting "this is
   Crispy" at 46% belief is the exact failure the three-zone band exists to
   prevent. */
function resolutionCard(r){
  if (!r) return "";
  const pct = Math.round((r.confidence || 0) * 100);
  const sure = r.confident;
  return `<div class="card ${sure ? "known" : ""}">
    <span class="chip ${sure ? "c" : "g"}">${sure ? "Resolved by your answer" : "Still unsure"}</span>
    <div class="sub" style="margin-top:8px">You said
      <b>${esc(r.answer)}</b> about <b>${esc(r.mention)}</b>.</div>
    <h3>${sure ? "" : "Probably "}${esc(r.name)}</h3>
    <div class="sub">${pct}% confident · ${(r.bits_remaining ?? 0).toFixed(2)} bits still open</div>
    ${sure ? "" : '<div class="sub" style="margin-top:7px">Recorded anyway — refusing to decide helps nobody — but worth checking in the person graph.</div>'}
  </div>`;
}

/* An ambiguity the band raised that produced no question — the records are too
   thin or too alike to separate. Saying so is better than showing nothing:
   silence looks like the ambiguity was never noticed. */
function unaskedCard(s){
  const open = (s.ambiguous || []).filter(a => a && a.person);
  if (!open.length || s.question) return "";
  return `<div class="card"><span class="chip c">Ambiguous · nothing worth asking</span>
    <div class="sub" style="margin-top:8px">${open.map(a =>
      esc(a.person.name || "a mention")).join(", ")} — every derived question
      scored zero, so the stored attributes cannot separate the candidates.</div></div>`;
}

function render(s, usage){
  const out = [];
  if (s.errors && s.errors.length)
    out.push(`<div class="bad">${s.errors.map(esc).join("<br>")}</div>`);

  // First, above the people. It is the contribution.
  out.push(questionCard(s.question, false));
  out.push(resolutionCard(s.resolution));
  out.push(unaskedCard(s));

  for (const p of s.new_people || []) {
    const bits = [p.role, p.company].filter(Boolean).join(" at ");
    const enr = (s.enrichments || {})[p.name] || "";
    const useful = enr && !enr.startsWith("NO RELIABLE") && !enr.startsWith("ENRICHMENT UNAVAILABLE");
    out.push(`<div class="card new"><span class="chip g">New contact</span>
      <h3>${esc(p.name)}</h3>
      <div class="sub">${esc(bits || "—")}${p.met_at ? " · met at " + esc(p.met_at) : ""}</div>
      ${useful ? '<ul class="facts">' + enr.split("\n").filter(l=>l.trim())
                   .map(l=>`<li>${esc(l.replace(/^[-*\s]+/,""))}</li>`).join("") + "</ul>"
               : '<div class="sub" style="margin-top:7px">No public info found — expected for most people.</div>'}
    </div>`);
  }

  for (const m of s.known_matches || []) {
    out.push(`<div class="card known"><span class="chip c">Already knew</span>
      <h3>${esc(m.person.name)}</h3>
      <div class="sub">Merged into existing record · ${Math.round((m.confidence||0)*100)}% confident</div>
      <div class="quote">${esc(m.reasoning)}</div></div>`);
  }

  if ((s.commitments || []).length) {
    out.push(`<div class="card todo"><h3>You promised</h3><ul class="todos">` +
      s.commitments.map(c => `<li><span class="who">${esc(c.person_name)}</span>
        <span>${esc(c.what)}</span>
        <span class="when">${esc(c.due || "no date")}</span></li>`).join("") +
      `</ul></div>`);
  }

  for (const d of s.drafts || []) {
    out.push(`<div class="card mail">
      <div class="mailhead">To ${esc(d.person_name)} · ${esc(d.channel || "email")}${d.subject ? " · " + esc(d.subject) : ""}</div>
      <div class="mailbody">${esc(d.body)}</div></div>`);
  }

  if ((s.calendar_events || []).length) {
    out.push(`<div class="card todo"><h3>Calendar</h3><ul class="todos">` +
      s.calendar_events.map(e => {
        // Google link first — one tap opens the event with a Save button, no
        // file to wrestle with. The .ics stays as a secondary link for people
        // who import into Apple Calendar or Outlook.
        const gcal = e.gcal
          ? ` <a class="ics" href="${esc(e.gcal)}" target="_blank" rel="noopener">Add to Google Calendar</a>`
          : "";
        const ics = (e.ics_path && e.status !== "declined")
          ? ` <a class="ics ics-file" href="/api/calendar/${esc(e.idempotency_key)}.ics">.ics</a>`
          : "";
        return `<li><span class="who">${esc(e.status)}</span>
        <span>${esc(e.detail || e.title || "")}</span>${gcal}${ics}</li>`;
      }).join("") +
      `</ul></div>`);
  }

  const cards = out.filter(Boolean);
  if (!cards.length) cards.push('<div class="blank">Nothing found in this memo.</div>');
  $("results").innerHTML = cards.join("");
  if (usage) {
    const cost = usage.unpriced && usage.unpriced.length
      ? `$${usage.cost} (excludes unpriced: ${usage.unpriced.join(", ")})` : `$${usage.cost}`;
    $("usage").textContent = `${usage.calls} model calls · ${usage.input} in / ${usage.output} out · ${cost}`;
  }
  $("rsec").classList.remove("hidden");
  $("rsec").scrollIntoView({behavior:"smooth", block:"nearest"});
}

drawDiagram();
// Filtering is client-side over the records already loaded: the whole graph is
// a few hundred people at most, so a round trip per keystroke would buy nothing.
// /people opens the record in place now, but a bookmarked ?person=<id> URL
// still lands on it.
loadPeople().then(openPersonFromUrl);
updateCount();
</script>
</body>
</html>
