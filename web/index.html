<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Warm dark, red-biased near-black rather than the usual blue-black.
   Marigold carries the primary accent, clay-rose marks people already known,
   warm sage marks completed work. */
:root{
  --bg:#17100E; --panel:#211714; --panel2:#2B1E19; --sunk:#120C0A;
  --line:#3B2A23; --line2:#4C362C;
  --ink:#F5E8DF; --ink2:#E0CCBE; --muted:#AD9184;
  --gold:#E9A23B; --gold-dim:#3A2A12; --gold-ink:#2A1B06;
  --clay:#DE7A63; --clay-dim:#3A1E17;
  --sage:#A6BC85; --sage-dim:#26301B;
  --rec:#E2543F;
  --display:"Bricolage Grotesque",Georgia,serif;
  --sans:"Figtree",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#FBF4EC; --panel:#FFFFFF; --panel2:#F5EAE0; --sunk:#F0E3D6;
    --line:#E7D6C6; --line2:#D8C0AC;
    --ink:#2B1C14; --ink2:#4A342A; --muted:#836757;
    --gold:#B0700E; --gold-dim:#FBEBD2; --gold-ink:#FFFFFF;
    --clay:#B24C34; --clay-dim:#FAE2DA;
    --sage:#5C7639; --sage-dim:#E7EFDA;
    --rec:#C4402B;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     font-size:15px;line-height:1.6;padding:0 24px 72px;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ---------- masthead ---------- */
.top{max-width:1180px;margin:0 auto;padding:30px 0 22px;display:flex;
     align-items:baseline;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:-.03em;
       margin:0;line-height:1}
.brand em{font-style:normal;color:var(--gold)}
.tag{color:var(--muted);font-size:14.5px;margin:0}
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;
       gap:26px;align-items:start}

/* ---------- shared blocks ---------- */
.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
       padding:20px 22px;margin-bottom:20px}
.lab{font-family:var(--mono);font-size:10.5px;font-weight:500;text-transform:uppercase;
     letter-spacing:.14em;color:var(--muted);margin:0 0 13px;display:flex;
     align-items:center;gap:9px}
.lab::before{content:"";width:14px;height:2px;background:var(--gold);border-radius:2px}
h2.h{font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:-.015em;margin:0 0 3px}

/* ---------- capture ---------- */
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font-size:14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);
     color:var(--ink);padding:9px 15px;cursor:pointer;transition:border-color .12s,background .12s}
.btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.go{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:600}
.btn.go:hover:not(:disabled){filter:brightness(1.08);color:var(--gold-ink)}
.btn.on{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:600}
.btn.on:hover{color:#fff}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;
     margin-right:7px;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.2}}
.time{font-family:var(--mono);font-size:14px;color:var(--rec)}
.note{color:var(--muted);font-size:13px;margin:11px 0 0}
textarea{width:100%;background:var(--sunk);color:var(--ink);border:1px solid var(--line);
         border-radius:8px;padding:14px 15px;font-family:var(--sans);font-size:15px;
         line-height:1.65;resize:vertical;min-height:118px;margin-top:14px}
textarea:focus{outline:none;border-color:var(--gold)}
textarea::placeholder{color:var(--muted);opacity:.75}
.gorow{display:flex;align-items:center;gap:13px;margin-top:13px}
.gorow .note{margin:0}

/* ---------- pipeline ---------- */
.pipewrap{background:linear-gradient(180deg,var(--panel2),var(--panel));
          border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 12px;margin-bottom:20px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.scroll svg{display:block;width:100%;min-width:660px;height:auto}
.nbox{fill:var(--sunk);stroke:var(--line2);stroke-width:1;rx:6}
.ntext{fill:var(--ink2);font-family:var(--mono);font-size:10.5px;font-weight:500}
.nsub{fill:var(--muted);font-family:var(--mono);font-size:8.5px}
.edge{stroke:var(--line2);stroke-width:1.6;fill:none}
g.n.run .nbox{fill:var(--gold-dim);stroke:var(--gold);stroke-width:1.6}
g.n.run .ntext{fill:var(--gold)}
g.n.done .nbox{fill:var(--sage-dim);stroke:var(--sage)}
g.n.done .ntext{fill:var(--sage)}
g.n.skip{opacity:.2}
path.edge.live{stroke:var(--sage);stroke-width:2}
path.edge.dead{opacity:.15;stroke-dasharray:3 3}
.key{display:flex;gap:15px;margin-top:11px;font-family:var(--mono);font-size:10.5px;
     color:var(--muted);flex-wrap:wrap;align-items:center}
.key i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.meter{font-family:var(--mono);font-size:12px;color:var(--gold);margin-top:10px}
.log{margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--muted);
     background:var(--sunk);border-radius:8px;padding:11px 13px;max-height:150px;overflow-y:auto}
.log div{padding:1.5px 0;overflow-wrap:anywhere}
.log div::before{content:"→ ";color:var(--gold)}

/* ---------- results ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line2);
      border-radius:8px;padding:15px 17px;margin-bottom:11px}
.card.new{border-left-color:var(--gold)}
.card.known{border-left-color:var(--clay)}
.card.todo{border-left-color:var(--sage)}
.card.mail{border-left-color:var(--ink2)}
.chip{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:500;
      text-transform:uppercase;letter-spacing:.11em;padding:3px 8px;border-radius:4px;margin-bottom:9px}
.chip.g{background:var(--gold-dim);color:var(--gold)}
.chip.c{background:var(--clay-dim);color:var(--clay)}
.card h3{font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:-.015em;
         margin:0 0 3px;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.quote{color:var(--ink2);font-size:13.5px;font-style:italic;margin-top:9px;padding-left:12px;
       border-left:2px solid var(--clay)}
.facts{margin:9px 0 0;padding-left:17px;font-size:14px}
.facts li{margin-bottom:3px}
.todos{list-style:none;margin:0;padding:0}
.todos li{display:flex;gap:11px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.todos li:last-child{border-bottom:none}
.todos .who{font-weight:600;flex-shrink:0}
.todos .when{font-family:var(--mono);font-size:11.5px;color:var(--sage);margin-left:auto;flex-shrink:0}
.mailhead{font-family:var(--mono);font-size:12px;color:var(--gold);padding-bottom:9px;
          margin-bottom:11px;border-bottom:1px dashed var(--line2)}
.mailbody{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);
          border-radius:7px;padding:13px 15px;font-size:14.5px}
.blank{color:var(--muted);font-style:italic}

/* ---------- the question, and what it beat ----------
   The claim this project makes is that the question was CHOSEN, by arithmetic.
   A panel showing only the question it asked would demonstrate nothing a prompt
   could not fake, so the rejected questions and their measured value get equal
   visual weight to the chosen one. */
.card.ask{border-left-color:var(--gold);background:
   linear-gradient(180deg,var(--gold-dim) 0%,var(--panel) 120px)}
.askq{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.3;
      letter-spacing:-.02em;margin:12px 0 0}
.bits{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--gold);
      white-space:nowrap}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.opt{font-family:var(--mono);font-size:11.5px;background:var(--panel2);color:var(--ink2);
     border:1px solid var(--line2);border-radius:999px;padding:5px 11px}
button.opt{cursor:pointer;transition:background .12s,border-color .12s,color .12s}
button.opt:hover:not(:disabled){background:var(--gold);border-color:var(--gold);
     color:var(--gold-ink)}
button.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.opt:disabled{cursor:default;opacity:.45}
button.opt.picked{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);
     opacity:1;font-weight:500}
.opt.else{color:var(--muted);border-style:dashed}
.hyps{margin:15px 0 0;display:grid;gap:6px}
.hyp{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;
     align-items:center;font-size:13px}
.hyp .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hyp .bar{height:7px;background:var(--sunk);border-radius:99px;overflow:hidden}
.hyp .bar i{display:block;height:100%;background:var(--clay);border-radius:99px}
.hyp .pc{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rej{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}
.rejrow{display:flex;align-items:baseline;gap:10px;justify-content:space-between;
        font-size:13.5px;color:var(--ink2);padding:4px 0}
.rejrow .bits{color:var(--muted)}
.rejrow.zero{opacity:.62}
.shape{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
       letter-spacing:.1em;color:var(--muted);border:1px solid var(--line2);
       border-radius:4px;padding:1px 5px}
.bad{background:var(--clay-dim);border:1px solid var(--clay);color:var(--clay);
     padding:11px 14px;border-radius:8px;font-size:14px;margin-bottom:11px}
.total{font-family:var(--mono);font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);
       padding-top:12px;margin-top:16px}

/* ---------- people sidebar ---------- */
.side{position:sticky;top:20px}
.side .block{margin-bottom:14px}
.pgrid{display:flex;flex-direction:column;gap:8px}
.pcard{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--line2);
       border-radius:8px;padding:11px 13px;font:inherit;color:inherit;text-align:left;
       width:100%;cursor:pointer;display:block;transition:border-color .12s}
.pcard:hover{border-color:var(--gold);border-left-color:var(--gold)}
.pcard:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pcard.hit{border-left-color:var(--clay);background:var(--clay-dim)}
.pcard.sel{border-color:var(--gold);border-left-color:var(--gold);background:var(--gold-dim)}
.pcard b{font-family:var(--display);font-weight:500;font-size:16px;letter-spacing:-.01em;
         overflow-wrap:anywhere}
.pcard .m2{color:var(--muted);font-size:12.5px;margin-top:1px;overflow-wrap:anywhere}
.pcard .cnt{font-family:var(--mono);font-size:10.5px;color:var(--gold);margin-top:6px}
.arw{float:right;color:var(--muted);font-size:13px}

/* ---------- person detail ---------- */
.detail{background:var(--panel);border:1px solid var(--gold);border-radius:var(--r);
        padding:18px 20px;margin-top:12px}
.detail h3{font-family:var(--display);font-weight:500;font-size:22px;letter-spacing:-.02em;margin:0}
.x{float:right;background:none;border:none;color:var(--muted);font-size:22px;line-height:1;
   padding:0 3px;cursor:pointer}
.x:hover{color:var(--ink)}
.dmeta{color:var(--muted);font-size:12.5px;margin:4px 0 15px}
.dsec{margin-top:15px}
.dsec h4{margin:0 0 8px;font-family:var(--mono);font-size:10px;text-transform:uppercase;
         letter-spacing:.13em;color:var(--muted);font-weight:500}
.note-item{background:var(--panel2);border-left:2px solid var(--gold);border-radius:6px;
           padding:9px 12px;margin-bottom:7px;font-size:14px;line-height:1.55;
           display:flex;gap:10px;align-items:flex-start}
.note-item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.note-item .idx{font-family:var(--mono);font-size:9.5px;color:var(--muted);display:block;margin-bottom:3px}
.xbtn{background:none;border:1px solid transparent;color:var(--muted);font-size:15px;line-height:1;
      padding:2px 7px;border-radius:5px;cursor:pointer;flex-shrink:0}
.xbtn:hover{color:var(--rec);border-color:var(--rec)}
.xbtn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.dactions{margin-top:17px;padding-top:14px;border-top:1px solid var(--line);
          display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.danger{border:1px solid var(--clay);color:var(--clay);background:none;font-size:13px;
        padding:7px 13px;border-radius:7px;cursor:pointer}
.danger:hover{background:var(--clay-dim)}
.danger.armed{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:600}
.hidden{display:none}
.swipe{display:none}

/* ---------- responsive ----------
   Three sizes: desk (two columns), tablet (one), phone (tighter everything).
   The pipeline keeps a minimum width and scrolls rather than shrinking -- the
   node labels stop being readable below ~660px, and an unreadable diagram is
   worse than one you swipe. */
@media (max-width:1000px){
  .shell{grid-template-columns:1fr;gap:18px}
  .side{position:static}          /* sticky is meaningless once stacked */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
}
@media (max-width:820px){
  .swipe{display:inline;margin-left:auto;color:var(--gold)}
}
@media (max-width:720px){
  body{font-size:14.5px;padding:0 16px 56px}
  .top{padding:22px 0 15px;gap:9px}
  .brand{font-size:27px}
  .tag{font-size:13.5px}
  .block,.pipewrap{padding:16px 15px}
  .detail{padding:16px 16px}
  textarea{min-height:130px}       /* more room to type on a phone */
  .card h3{font-size:17.5px}
  .detail h3{font-size:20px}
  .todos li{flex-wrap:wrap;gap:6px}
  .todos .when{margin-left:0;flex-basis:100%}   /* date drops to its own line */
  .log{max-height:120px}
}
@media (max-width:430px){
  body{padding:0 12px 48px}
  .brand{font-size:24px}
  .row{gap:8px}
  .btn{padding:10px 13px;font-size:13.5px}
  .pgrid{grid-template-columns:1fr}
  .gorow{flex-wrap:wrap}
}
/* Finger-sized hit areas on touch devices. The × buttons sit in a tight column
   and are the easiest thing to mis-tap -- and one of them deletes a note. */
@media (pointer:coarse){
  .btn{min-height:44px}
  .xbtn{min-width:40px;min-height:40px}
  .x{min-width:40px;min-height:40px}
  .pcard{padding:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <h1 class="brand">Re<em>call</em></h1>
  <p class="tag">Talk about who you met. Get contacts, commitments, and drafted follow-ups.</p>
</div>

<div class="shell">
<main>

  <div class="block">
    <p class="lab">Your memo</p>
    <div class="row">
      <button id="rec" class="btn go">● Record</button>
      <span class="time" id="timer"></span>
      <button id="pick" class="btn">Upload audio</button>
      <input type="file" id="file" accept="audio/*" class="hidden">
      <button id="sample" class="btn">Use sample</button>
      <button id="clear" class="btn">Clear</button>
    </div>
    <p class="note" id="hint">Record, or just type below. Chrome recommended for the microphone.</p>
    <textarea id="transcript"
      placeholder="Type what happened — who you met, what you talked about, anything you promised them.&#10;&#10;e.g. Met Wei Lin from GIC at the mixer, she's hiring for a quant infra role. Said I'd send her the Kestrel repo tomorrow."></textarea>
    <div class="gorow">
      <button id="run" class="btn go">Run the agent →</button>
      <span class="note" id="charcount"></span>
    </div>
  </div>

  <div id="psec" class="hidden">
    <div class="pipewrap">
      <p class="lab">The agent, running</p>
      <div class="scroll" id="diagram"></div>
      <div class="key">
        <span><i style="background:var(--sage)"></i>ran</span>
        <span><i style="background:var(--gold)"></i>running</span>
        <span><i style="background:var(--line2)"></i>branch not taken</span>
        <span class="swipe">swipe to see it all →</span>
      </div>
      <div class="meter" id="live"></div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div id="rsec" class="hidden">
    <div class="block">
      <p class="lab">Result</p>
      <div id="results"></div>
      <div class="total" id="usage"></div>
    </div>
  </div>

</main>

<aside class="side">
  <div class="block">
    <p class="lab">People I know <span id="pcount" style="letter-spacing:0;text-transform:none"></span></p>
    <div class="pgrid" id="people"></div>
    <p class="note" id="phint"></p>
  </div>
  <div id="pdetail"></div>
</aside>
</div>

<script>

const $ = id => document.getElementById(id);
/* The diagram mirrors recall/graph.py exactly. x/y are viewBox units.
   The fork after `dedupe` is the whole point of drawing this rather than
   listing chips: a viewer can see which branch the router chose. */
const NODES = {
  transcribe:  {x:  10, y: 40, label:"transcribe",  sub:"groq whisper"},
  extract:     {x: 138, y: 40, label:"extract",     sub:"structured"},
  dedupe:      {x: 266, y: 40, label:"dedupe",      sub:"3-zone band"},
  ask:         {x: 394, y: 40, label:"ask",         sub:"argmax EIG"},
  enrich:      {x: 528, y: 10, label:"enrich",      sub:"sub-agent · web"},
  merge:       {x: 528, y: 70, label:"merge",       sub:"into record"},
  commitments: {x: 662, y: 40, label:"commitments", sub:"structured"},
  drafts:      {x: 790, y: 40, label:"drafts",      sub:"sub-agent"},
  calendar:    {x: 918, y: 40, label:"calendar",    sub:"idempotent"},
  persist:     {x:1046, y: 40, label:"persist",     sub:"memory"},
};
const W = 110, H = 34;
/* Mirrors recall/graph.py. `ask -> commitments` is real but not drawn: it
   would cross both branch boxes, and the branch is the thing this picture
   exists to show. */
const EDGES = [
  ["transcribe","extract"], ["extract","dedupe"], ["dedupe","ask"],
  ["ask","enrich"], ["ask","merge"],
  ["enrich","commitments"], ["merge","commitments"],
  ["commitments","drafts"], ["drafts","calendar"], ["calendar","persist"],
];

function drawDiagram(){
  const edges = EDGES.map(([a,b]) => {
    const A = NODES[a], B = NODES[b];
    const x1 = A.x + W, y1 = A.y + H/2, x2 = B.x, y2 = B.y + H/2;
    const d = y1 === y2
      ? `M${x1},${y1} L${x2},${y2}`
      : `M${x1},${y1} C${x1+14},${y1} ${x2-14},${y2} ${x2},${y2}`;
    return `<path class="edge" id="e-${a}-${b}" d="${d}" marker-end="url(#ar)"/>`;
  }).join("");

  const boxes = Object.entries(NODES).map(([k,n]) => `
    <g class="n" id="n-${k}">
      <rect class="nbox" x="${n.x}" y="${n.y}" width="${W}" height="${H}"/>
      <text class="ntext" x="${n.x+9}" y="${n.y+15}">${n.label}</text>
      <text class="nsub"  x="${n.x+9}" y="${n.y+26}">${n.sub}</text>
    </g>`).join("");

  $("diagram").innerHTML = `<svg viewBox="0 0 1168 118" role="img"
      aria-label="Recall pipeline: transcribe, extract, dedupe, ask, then a conditional branch to enrich or merge, then commitments, drafts, calendar, persist.">
    <defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--line)"/></marker></defs>
    ${edges}${boxes}</svg>`;
}

const ALL = () => Object.keys(NODES);
function setNode(n, cls){ const e = $("n-"+n); if(e) e.setAttribute("class", "n " + cls); }
function setEdge(a, b, cls){ const e = $(`e-${a}-${b}`); if(e) e.setAttribute("class","edge "+cls); }
function log(msg){ const d=document.createElement("div"); d.textContent=msg; $("log").appendChild(d); $("log").scrollTop=1e6; }

/* ---------- people graph ---------- */
let lastHits = new Set(), PEOPLE = {}, selectedId = null;
async function loadPeople(){
  try {
    const r = await fetch("/api/people");
    const j = await r.json();
    $("pcount").textContent = j.count ? `— ${j.count} remembered` : "";
    if (!j.count) {
      PEOPLE = {}; closePerson();
      $("people").innerHTML = "";
      $("phint").textContent = "Empty. Run a memo and the people in it are remembered here — that is what the next run dedupes against.";
      return;
    }
    $("phint").textContent = "";
    PEOPLE = {};
    $("people").innerHTML = j.people.map(p => {
      PEOPLE[p.id] = p;
      const bits = [p.role, p.company].filter(Boolean).join(" at ");
      const hit = lastHits.has(p.name) ? " hit" : "";
      const sel = selectedId === p.id ? " sel" : "";
      return `<button class="pcard${hit}${sel}" data-id="${esc(p.id)}"
                 aria-expanded="${selectedId === p.id}">
        <span class="arw">›</span>
        <b>${esc(p.name)}</b>
        <div class="m2">${esc(bits || "—")}</div>
        <div class="cnt">${p.notes.length} note${p.notes.length===1?"":"s"} · ${p.met_at.length} meeting${p.met_at.length===1?"":"s"}</div>
      </button>`;
    }).join("");
    $("people").querySelectorAll(".pcard").forEach(b => {
      b.onclick = () => showPerson(b.dataset.id);
    });
    if (selectedId && PEOPLE[selectedId]) showPerson(selectedId, true);
    else if (selectedId) closePerson();
  } catch (e) { $("phint").textContent = "Could not load the person graph: " + e.message; }
}

/* Clicking a card opens the full stored record. The notes list is the point:
   one entry per memo the person appeared in, so you can watch a record deepen
   across sessions rather than take the dedupe step's word for it. */
function showPerson(id, keepOpen){
  const p = PEOPLE[id];
  if (!p) return;
  if (selectedId === id && !keepOpen) { closePerson(); return; }

  selectedId = id;
  $("people").querySelectorAll(".pcard").forEach(b => {
    const on = b.dataset.id === id;
    b.classList.toggle("sel", on);
    b.setAttribute("aria-expanded", String(on));
  });

  const bits = [p.role, p.company].filter(Boolean).join(" at ");
  const enr = p.enrichment && !String(p.enrichment).startsWith("NO RELIABLE") ? p.enrichment : "";
  const sec = (title, inner) => inner ? `<div class="dsec"><h4>${title}</h4>${inner}</div>` : "";

  $("pdetail").innerHTML = `<div class="detail">
    <button class="x" id="dclose" aria-label="Close">×</button>
    <h3>${esc(p.name)}</h3>
    <div class="dmeta">${esc(bits || "no company or role recorded")}
      · first seen ${esc(p.first_seen||"?")} · last seen ${esc(p.last_seen||"?")}</div>
    ${sec(`What you recorded (${p.notes.length})`,
        p.notes.map((n,i) => `<div class="note-item">
          <span class="txt"><span class="idx">memo ${i+1}</span>${esc(n)}</span>
          <button class="xbtn" data-kind="notes" data-i="${i}" title="Delete this note"
                  aria-label="Delete note ${i+1}">×</button>
        </div>`).join(""))}
    ${sec("Where you met", p.met_at.length ? p.met_at.map((m,i) => `<div class="note-item">
          <span class="txt">${esc(m)}</span>
          <button class="xbtn" data-kind="met_at" data-i="${i}" title="Delete this entry"
                  aria-label="Delete meeting ${i+1}">×</button>
        </div>`).join("") : "")}
    ${sec("Public background", enr ? "<ul class=\"facts\">" + enr.split("\n").filter(l=>l.trim())
        .map(l=>`<li>${esc(l.replace(/^[-*\s]+/,""))}</li>`).join("") + "</ul>" : "")}
    <div class="dactions">
      <button class="danger" id="dforget">Forget this person</button>
      <span class="note" id="dstatus" style="margin:0"></span>
    </div>
  </div>`;
  $("dclose").onclick = closePerson;
  $("pdetail").querySelectorAll(".xbtn").forEach(b => {
    b.onclick = () => removeEntry(p.id, b.dataset.kind, Number(b.dataset.i));
  });
  armForget(p);
  if (!keepOpen) $("pdetail").scrollIntoView({behavior:"smooth", block:"nearest"});
}

/* Deleting one note or meeting place: send the whole shortened list, because
   the store accumulates on upsert and would otherwise re-add what was removed. */
async function removeEntry(id, kind, index){
  const p = PEOPLE[id];
  if (!p) return;
  const next = (p[kind] || []).filter((_, i) => i !== index);
  try {
    const r = await fetch(`/api/people/${encodeURIComponent(id)}`, {
      method: "PATCH", headers: {"content-type": "application/json"},
      body: JSON.stringify({[kind]: next})
    });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    p[kind] = next;
    showPerson(id, true);
    loadPeople();
  } catch (e) { setStatus("Could not delete: " + e.message); }
}

/* Two-step confirm. Forgetting someone is irreversible and the button sits
   right under a list of × buttons, so a single stray click must not do it. */
function armForget(p){
  const btn = $("dforget");
  if (!btn) return;
  let armed = false;
  btn.onclick = async () => {
    if (!armed) {
      armed = true;
      btn.textContent = `Really forget ${p.name}?`;
      btn.classList.add("armed");
      setStatus("Click again to confirm. This cannot be undone.");
      setTimeout(() => {
        if (!armed) return;
        armed = false;
        btn.textContent = "Forget this person";
        btn.classList.remove("armed");
        setStatus("");
      }, 5000);
      return;
    }
    try {
      const r = await fetch(`/api/people/${encodeURIComponent(p.id)}`, {method: "DELETE"});
      if (!r.ok) throw new Error((await r.json()).error || r.statusText);
      closePerson();
      loadPeople();
    } catch (e) { setStatus("Could not forget: " + e.message); }
  };
}

function setStatus(msg){ const e = $("dstatus"); if (e) e.textContent = msg; }

function closePerson(){
  selectedId = null;
  $("pdetail").innerHTML = "";
  $("people").querySelectorAll(".pcard").forEach(b => {
    b.classList.remove("sel"); b.setAttribute("aria-expanded","false");
  });
}

let mediaRecorder, chunks = [], starting = false;

/* ---------- recording ----------
   Everything about one recording session lives in locals captured here, not in
   module state. The timer used to read the module-level recorder and store its
   own handle in a module-level `tick`: a second click during the getUserMedia
   await started a second session, orphaned the first recorder's stream and lost
   its interval handle, so that interval ticked forever and kept writing the
   timer after Stop. Now each session's timer can only touch its own recorder,
   and clears itself the moment that recorder is no longer recording. */
$("rec").onclick = async () => {
  if (mediaRecorder && mediaRecorder.state !== "inactive") { mediaRecorder.stop(); return; }
  // The await below is a window in which the guard above still sees the *old*
  // recorder, so without this an impatient second click starts a second one.
  if (starting) return;
  starting = true;
  $("rec").disabled = true;

  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch (e) { $("hint").textContent = "Microphone blocked: " + e.message + ". Check the address bar permission icon."; return; }
  finally { starting = false; $("rec").disabled = false; }

  chunks = [];
  const rec = new MediaRecorder(stream);
  mediaRecorder = rec;

  // Declared before finish() so there is no temporal-dead-zone hazard if a
  // handler ever fires earlier than expected.
  let tick;
  // Idempotent: stop() fires onstop once, but an error path may also land here.
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    clearInterval(tick);
    stream.getTracks().forEach(t => t.stop());
    $("timer").textContent = "";
    $("rec").className = "btn go"; $("rec").innerHTML = "● Record"; $("rec").disabled = false;
  };

  rec.ondataavailable = e => chunks.push(e.data);
  rec.onerror = () => { finish(); $("hint").textContent = "Recording stopped unexpectedly."; };
  rec.onstop = () => { finish(); sendAudio(new Blob(chunks, {type: rec.mimeType}), "memo"); };

  rec.start();
  const startedAt = Date.now();
  $("rec").className = "btn on"; $("rec").innerHTML = '<span class="dot"></span>Stop';
  tick = setInterval(() => {
    // Self-clearing, so this timer cannot outlive its own recording even if
    // onstop never arrives. Guarding the cap on state also stops the old code
    // calling stop() every 250ms once past 120s, which throws InvalidStateError
    // on an already-inactive recorder without cancelling the interval.
    if (rec.state !== "recording") { clearInterval(tick); return; }
    const s = Math.floor((Date.now()-startedAt)/1000);
    $("timer").textContent = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
    if (s >= 120) rec.stop();   // Groq free tier caps upload size
  }, 250);
};

$("pick").onclick = () => $("file").click();
$("file").onchange = e => { if (e.target.files[0]) sendAudio(e.target.files[0], e.target.files[0].name); };
$("sample").onclick = () => {
  $("transcript").value =
"Just left the SuperAI mixer at Marina Bay Sands. Met Wei Lin from GIC, she's a quant infrastructure lead, "+
"complaining their feature store is held together with cron jobs. She's hiring for a quant infra role. I said "+
"I'd send her the Kestrel repo tomorrow. Also met Arjun Menon at Sea Group on recommendations, he did that talk "+
"on embedding drift. I told him I'd introduce him to Marcus by end of week.";
  updateCount();
  $("transcript").focus();
};

$("clear").onclick = () => {
  $("transcript").value = ""; updateCount(); $("transcript").focus();
  $("hint").textContent = "Record, or just type below. Chrome recommended for the microphone.";
};

function updateCount(){
  const n = $("transcript").value.trim().length;
  $("charcount").textContent = n ? `${n} characters` : "";
  $("run").disabled = n === 0;
}
$("transcript").addEventListener("input", updateCount);

// Cmd/Ctrl+Enter runs, so a typed memo never needs the mouse.
$("transcript").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && !$("run").disabled) $("run").click();
});

async function sendAudio(blob, name){
  $("hint").textContent = "Transcribing…";
  const fd = new FormData();
  fd.append("audio", blob, name);
  try {
    const r = await fetch("/api/transcribe", {method:"POST", body:fd});
    const j = await r.json();
    if (!r.ok) { $("hint").textContent = j.error || "Transcription failed."; return; }
    $("hint").textContent = "Transcribed. Check the names — the box below is editable — then run.";
    // Append rather than overwrite, so recording a second thought adds to a
    // memo instead of destroying what is already typed.
    const existing = $("transcript").value.trim();
    $("transcript").value = existing ? existing + "\n\n" + j.transcript : j.transcript;
    updateCount();
    $("transcript").focus();
  } catch (e) { $("hint").textContent = "Could not reach the server: " + e.message; }
}

/* ---------- run ---------- */
$("run").onclick = async () => {
  const transcript = $("transcript").value.trim();
  if (!transcript) return;
  $("run").disabled = true;
  $("psec").classList.remove("hidden");
  $("rsec").classList.add("hidden");
  $("log").innerHTML = ""; $("results").innerHTML = ""; $("usage").textContent = "";
  ranNodes = new Set();
  drawDiagram();
  ALL().forEach(n => setNode(n, ""));
  EDGES.forEach(([a,b]) => setEdge(a,b,""));
  setNode("transcribe","done"); log("Transcript supplied.");
  $("live").textContent = "";

  await drive("/api/run", {transcript});
  $("run").disabled = false;
};

/* Both legs of a run stream identical NDJSON: /api/run until the graph either
   finishes or stops to ask, then /api/answer for the rest. One reader handles
   both, so a resumed run lights the pipeline strip exactly like a fresh one. */
async function drive(url, body){
  try {
    const res = await fetch(url, {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify(body)
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split("\n"); buf = lines.pop();
      for (const l of lines) { if (l.trim()) handle(JSON.parse(l)); }
    }
  } catch (e) {
    $("results").innerHTML = `<div class="bad">${esc(e.message)}</div>`;
    $("rsec").classList.remove("hidden");
  }
}

/* The id of the run currently paused on a question. Null whenever nothing is
   waiting, which is what stops a second click answering an already-answered
   question and resuming a run that has moved on. */
let pendingThread = null;

async function answer(value){
  if (!pendingThread) return;
  const thread = pendingThread;
  pendingThread = null;

  document.querySelectorAll("#results .opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.value === value) b.classList.add("picked");
  });
  log(`Answered: ${value}`);
  await drive("/api/answer", {thread_id: thread, answer: value});
}

let ranNodes = new Set();
function handle(ev){
  if (ev.type === "node") {
    ranNodes.add(ev.node);
    setNode(ev.node, "done");
    // Light the edges into this node from anything that already ran.
    EDGES.forEach(([a,b]) => { if (b === ev.node && ranNodes.has(a)) setEdge(a,b,"live"); });
    if (ev.note) log(ev.note);
    if (ev.usage) showLive(ev.usage);
  } else if (ev.type === "done") {
    // Whatever never arrived is dimmed. On a memo with only known people the
    // enrich box and its edges stay dark -- that IS the conditional edge.
    ALL().forEach(n => { if (!ranNodes.has(n)) setNode(n, "skip"); });
    EDGES.forEach(([a,b]) => {
      if (!(ranNodes.has(a) && ranNodes.has(b))) setEdge(a,b,"dead");
    });
    lastHits = new Set((ev.state.known_matches||[]).map(m => m.person.name));
    render(ev.state, ev.usage);
    loadPeople();
  } else if (ev.type === "question") {
    // The graph is PAUSED, not finished. The pipeline strip deliberately keeps
    // its unrun nodes undimmed -- dimming them is the "done" signal, and this
    // run is very much still going.
    pendingThread = ev.thread_id;
    $("results").innerHTML = questionCard(ev.question, true);
    $("rsec").classList.remove("hidden");
    $("rsec").scrollIntoView({behavior:"smooth", block:"nearest"});
    if (ev.usage) showLive(ev.usage);
    document.querySelectorAll("#results .opt").forEach(b => {
      b.onclick = () => answer(b.dataset.value);
    });
  } else if (ev.type === "error") {
    $("results").innerHTML = `<div class="bad">${esc(ev.message)}</div>`;
    $("rsec").classList.remove("hidden");
  }
}

function showLive(u){
  const cost = (u.unpriced && u.unpriced.length) ? "unpriced model" : `$${u.cost}`;
  $("live").textContent = `${u.calls} model calls · ${u.input} in / ${u.output} out · ${cost}`;
}

function esc(s){ return String(s??"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* The chosen question, the candidates it is choosing between, and the questions
   it turned down with the bits each was worth.

   Rejected questions are not decoration. "Same school as you?" sounds like a
   sensible thing to ask and is worth 0.000 bits here, because both candidates
   answer it identically; showing that number next to the one it did ask is the
   only thing that separates a computed choice from a plausible-sounding one. */
function questionCard(q, live){
  if (!q) return "";

  const hyps = (q.hypotheses || []).map(h => {
    const pct = Math.round((h.prior || 0) * 100);
    const label = h.record_id ? h.name : "someone new";
    return `<div class="hyp"><span class="nm">${esc(label)}</span>
      <span class="bar"><i style="width:${pct}%"></i></span>
      <span class="pc">${pct}%</span></div>`;
  }).join("");

  // Buttons only while the graph is actually waiting. After the run has moved
  // on they render as plain pills -- a control that looks live and does nothing
  // is worse than no control.
  const opts = (q.answers || []).map(a => {
    const cls = "opt" + (a === "something else" ? " else" : "");
    return live
      ? `<button class="${cls}" data-value="${esc(a)}">${esc(a)}</button>`
      : `<span class="${cls}">${esc(a)}</span>`;
  }).join("");

  const rejected = (q.rejected || []).map(r => `
    <div class="rejrow${r.eig < 0.0005 ? " zero" : ""}">
      <span>${esc(r.question)} <span class="shape">${esc(r.kind)}</span></span>
      <span class="bits">${r.eig.toFixed(3)} bits</span>
    </div>`).join("");

  // Bits bought against bits outstanding. 0.80 is a different claim against a
  // 1.27-bit prior than against 3.0, and the ratio is what a judge will ask for.
  const prior = q.prior_entropy;
  const context = prior
    ? `${q.eig.toFixed(3)} of ${prior.toFixed(3)} bits · ${Math.round(100*q.eig/prior)}% of the uncertainty`
    : `${q.eig.toFixed(3)} bits`;

  return `<div class="card ask">
    <span class="chip g">One question · chosen by EIG</span>
    <div class="sub" style="margin-top:8px">Cannot tell who
      <b>${esc(q.mention)}</b> is. ${(q.hypotheses||[]).length} candidates:</div>
    ${hyps}
    <p class="askq">${esc(q.question)}</p>
    <div class="sub" style="margin-top:7px"><span class="bits">${esc(context)}</span></div>
    <div class="opts">${opts}</div>
    ${live ? '<p class="note" style="margin-top:10px">Waiting — the run is paused here.</p>' : ""}
    ${rejected ? `<div class="rej">
      <p class="lab" style="margin-bottom:8px">Questions it did not ask</p>
      ${rejected}</div>` : ""}
  </div>`;
}

/* What the answer settled. Shown separately from the question so the two are
   visibly cause and effect, and so the confidence is stated rather than implied:
   one answer does not always settle a three-way tie, and asserting "this is
   Crispy" at 46% belief is the exact failure the three-zone band exists to
   prevent. */
function resolutionCard(r){
  if (!r) return "";
  const pct = Math.round((r.confidence || 0) * 100);
  const sure = r.confident;
  return `<div class="card ${sure ? "known" : ""}">
    <span class="chip ${sure ? "c" : "g"}">${sure ? "Resolved by your answer" : "Still unsure"}</span>
    <div class="sub" style="margin-top:8px">You said
      <b>${esc(r.answer)}</b> about <b>${esc(r.mention)}</b>.</div>
    <h3>${sure ? "" : "Probably "}${esc(r.name)}</h3>
    <div class="sub">${pct}% confident · ${(r.bits_remaining ?? 0).toFixed(2)} bits still open</div>
    ${sure ? "" : '<div class="sub" style="margin-top:7px">Recorded anyway — refusing to decide helps nobody — but worth checking in the person graph.</div>'}
  </div>`;
}

/* An ambiguity the band raised that produced no question — the records are too
   thin or too alike to separate. Saying so is better than showing nothing:
   silence looks like the ambiguity was never noticed. */
function unaskedCard(s){
  const open = (s.ambiguous || []).filter(a => a && a.person);
  if (!open.length || s.question) return "";
  return `<div class="card"><span class="chip c">Ambiguous · nothing worth asking</span>
    <div class="sub" style="margin-top:8px">${open.map(a =>
      esc(a.person.name || "a mention")).join(", ")} — every derived question
      scored zero, so the stored attributes cannot separate the candidates.</div></div>`;
}

function render(s, usage){
  const out = [];
  if (s.errors && s.errors.length)
    out.push(`<div class="bad">${s.errors.map(esc).join("<br>")}</div>`);

  // First, above the people. It is the contribution.
  out.push(questionCard(s.question, false));
  out.push(resolutionCard(s.resolution));
  out.push(unaskedCard(s));

  for (const p of s.new_people || []) {
    const bits = [p.role, p.company].filter(Boolean).join(" at ");
    const enr = (s.enrichments || {})[p.name] || "";
    const useful = enr && !enr.startsWith("NO RELIABLE") && !enr.startsWith("ENRICHMENT UNAVAILABLE");
    out.push(`<div class="card new"><span class="chip g">New contact</span>
      <h3>${esc(p.name)}</h3>
      <div class="sub">${esc(bits || "—")}${p.met_at ? " · met at " + esc(p.met_at) : ""}</div>
      ${useful ? '<ul class="facts">' + enr.split("\n").filter(l=>l.trim())
                   .map(l=>`<li>${esc(l.replace(/^[-*\s]+/,""))}</li>`).join("") + "</ul>"
               : '<div class="sub" style="margin-top:7px">No public info found — expected for most people.</div>'}
    </div>`);
  }

  for (const m of s.known_matches || []) {
    out.push(`<div class="card known"><span class="chip c">Already knew</span>
      <h3>${esc(m.person.name)}</h3>
      <div class="sub">Merged into existing record · ${Math.round((m.confidence||0)*100)}% confident</div>
      <div class="quote">${esc(m.reasoning)}</div></div>`);
  }

  if ((s.commitments || []).length) {
    out.push(`<div class="card todo"><h3>You promised</h3><ul class="todos">` +
      s.commitments.map(c => `<li><span class="who">${esc(c.person_name)}</span>
        <span>${esc(c.what)}</span>
        <span class="when">${esc(c.due || "no date")}</span></li>`).join("") +
      `</ul></div>`);
  }

  for (const d of s.drafts || []) {
    out.push(`<div class="card mail">
      <div class="mailhead">To ${esc(d.person_name)} · ${esc(d.channel || "email")}${d.subject ? " · " + esc(d.subject) : ""}</div>
      <div class="mailbody">${esc(d.body)}</div></div>`);
  }

  if ((s.calendar_events || []).length) {
    out.push(`<div class="card todo"><h3>Calendar</h3><ul class="todos">` +
      s.calendar_events.map(e => `<li><span class="who">${esc(e.status)}</span>
        <span>${esc(e.detail || e.title || "")}</span></li>`).join("") +
      `</ul></div>`);
  }

  const cards = out.filter(Boolean);
  if (!cards.length) cards.push('<div class="blank">Nothing found in this memo.</div>');
  $("results").innerHTML = cards.join("");
  if (usage) {
    const cost = usage.unpriced && usage.unpriced.length
      ? `$${usage.cost} (excludes unpriced: ${usage.unpriced.join(", ")})` : `$${usage.cost}`;
    $("usage").textContent = `${usage.calls} model calls · ${usage.input} in / ${usage.output} out · ${cost}`;
  }
  $("rsec").classList.remove("hidden");
  $("rsec").scrollIntoView({behavior:"smooth", block:"nearest"});
}

drawDiagram();
loadPeople();
updateCount();
</script>
</body>
</html>
